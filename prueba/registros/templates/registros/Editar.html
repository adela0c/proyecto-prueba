{% extends "inicio/encabezado.html" %}

{% block titulo %} Editar Comentario {% endblock %}

{% block contenido %}

<div class="container mt-4" style="max-width: 700px;">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-primary text-white text-center rounded-top-4">
            <h3 class="m-0">Editar Comentario</h3>
        </div>

        <div class="card-body p-4">

            <form method="POST">
                {% csrf_token %}

                <!-- Usuario -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <input 
                        type="text" 
                        name="usuario" 
                        value="{{ comentario.usuario }}" 
                        class="form-control border-primary"
                        placeholder="Ingresa el nombre del usuario">
                </div>

                <!-- Mensaje -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mensaje</label>
                    <textarea 
                        name="mensaje" 
                        class="form-control border-primary" 
                        rows="5"
                        placeholder="Escribe el mensaje actualizado">{{ comentario.mensaje }}</textarea>
                </div>

                <!-- Botones -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success px-4">Actualizar</button>
                    <a href="{% url 'Mensaje' %}" class="btn btn-secondary px-4 ms-2">Cancelar</a>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
